services:
  - type: web
    name: jev-triaje
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TYPESAFE_API_KEY
        sync: false
      - key: CODIGO_ACCESO
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
