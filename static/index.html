<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Triaje de mensajes · Jev</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header></header>
<main>
  <div class="eyebrow">Patrón · Enrutado por intención</div>
  <h1>📨 Triaje de mensajes</h1>
  <p class="lead">Cada mensaje de cliente pasa por Jev: tipo (Choice), spam (Noul) y urgencia (Score) en una sola llamada. Toca un mensaje para ver qué se envió y qué respondió.</p>

  <div class="grid">
    <section class="panel">
      <div class="panel-head">
        <span><span class="dot"></span>MENSAJES DE CLIENTES</span>
        <button class="ghost" id="ejemplos">▶ Probar ejemplos</button>
      </div>
      <div id="lista" class="panel-body" style="min-height:260px;max-height:60dvh;overflow-y:auto">
        <div class="vacio" id="vacio">Toca «Probar ejemplos» o escribe tu propio mensaje.</div>
      </div>
      <form id="form" class="fila" style="padding:12px;border-top:1px solid var(--line);flex-wrap:nowrap">
        <input id="entrada" placeholder="Escribe un mensaje de cliente…" maxlength="1000" autocomplete="off">
        <button class="primary" id="enviar">Enviar</button>
      </form>
    </section>
    <section id="json"></section>
  </div>
</main>
<script src="/static/comun.js"></script>
<script>
const lista = $("#lista"), panel = panelJSON($("#json"));
const EQUIPO = { consulta: "atención al cliente", queja: "soporte", venta: "ventas", otro: "bandeja general" };
let ejemplos = [];

function decidir(r) {
  if (r.spam > 0.8) return ["bad", "🚫 Spam → descartar"];
  const conf = Math.min(r.tipo_conf, r.urgencia_conf);
  if (conf < 0.6) return ["warn", `⚠ Confianza baja (${pct(conf)}) → revisar a mano`];
  return ["ok", `✓ Enviar a ${EQUIPO[r.tipo]} · prioridad ${r.urgencia}`];
}

function pintar(card, r) {
  card.replaceChildren(el("div", "txt", r.mensaje));
  const tags = el("div", "tags");
  tags.append(
    tag("tipo", `${r.tipo} ${pct(r.tipo_probs[r.tipo])}`),
    tag("spam", pct(r.spam)),
    tag("urgencia", `${r.urgencia} ${r.urgencia_score.toFixed(2)}/2`),
  );
  const [cls, txt] = decidir(r);
  card.append(tags, barras([["confianza tipo", r.tipo_conf], ["confianza urgencia", r.urgencia_conf]]),
              el("div", "decision " + cls, txt));
  card.onclick = () => { marcar(card); panel.mostrar(r.llamada); };
}

async function analizar(mensaje) {
  $("#vacio")?.remove();
  const card = el("div", "card");
  card.style.display = "grid"; card.style.gap = "10px";
  card.append(el("div", "txt", mensaje), el("div", "cargando", "Jev está pensando…"));
  lista.append(card);
  lista.scrollTop = lista.scrollHeight;
  try {
    const r = await api("/api/triaje", { mensaje });
    pintar(card, r);
    marcar(card);
    panel.mostrar(r.llamada);
  } catch (e) {
    card.querySelector(".cargando").replaceWith(el("div", "err", "Error: " + e.message));
  }
}

$("#form").onsubmit = async (e) => {
  e.preventDefault();
  const m = $("#entrada").value.trim();
  if (!m) return;
  $("#entrada").value = "";
  $("#enviar").disabled = true;
  await analizar(m);
  $("#enviar").disabled = false;
};
$("#ejemplos").onclick = async () => {
  $("#ejemplos").disabled = true;
  await Promise.all(ejemplos.map(analizar));
  $("#ejemplos").disabled = false;
};
api("/api/ejemplos/triaje").then((d) => (ejemplos = d.mensajes));
</script>
</body>
</html>
